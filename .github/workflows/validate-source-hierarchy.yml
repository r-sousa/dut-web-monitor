name: Validate DUT source hierarchy

on:
  push:
    paths:
      - ".github/workflows/validate-source-hierarchy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
      - name: Refresh datasets under source hierarchy
        run: |
          python -m dut_monitor.runner --output public
          for file in manifest calls events news publications webinars newsletters changes-latest; do
            python -m json.tool "public/${file}.json" >/dev/null
          done
      - name: Commit validated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public data/legacy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: clean DUT source migration records"
          git push

# Retry after natural-identity migration cleanup.
