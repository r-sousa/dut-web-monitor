name: Bootstrap DUT web monitor

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand prepared repository payload
        shell: bash
        run: |
          cat > /tmp/dut_payload.b64 <<'PAYLOAD'
[TRUNCATED]...