name: Bootstrap DUT web monitor

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand prepared repository payload
        shell: bash
        run: |
          cat .bootstrap/payload.part* > /tmp/dut_payload.b64
          base64 --decode /tmp/dut_payload.b64 > /tmp/dut_payload.tar.gz
          tar -xzf /tmp/dut_payload.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit populated repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Populate DUT web monitor"
          git push
