name: Apply webinars and newsletters extension

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-webinars-newsletters.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand tested extension
        shell: bash
        run: |
          cat .extension/dutext.part* > /tmp/dut-extension.b64
          base64 --decode /tmp/dut-extension.b64 > /tmp/dut-extension.tar.gz
          tar -xzf /tmp/dut-extension.tar.gz -C .
          rm -rf .extension

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - name: Refresh live DUT datasets
        run: |
          python -m dut_monitor.runner --output public
          python -m json.tool public/manifest.json >/dev/null
          python -m json.tool public/calls.json >/dev/null
          python -m json.tool public/events.json >/dev/null
          python -m json.tool public/publications.json >/dev/null
          python -m json.tool public/webinars.json >/dev/null
          python -m json.tool public/newsletters.json >/dev/null
          python -m json.tool public/changes-latest.json >/dev/null

      - name: Commit tested extension and refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .extension README.md src tests schemas docs public
          git commit -m "feat: add webinar and newsletter datasets"
          git push
